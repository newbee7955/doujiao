appId: com.doujiao.app
productName: 豆角工具箱
electronVersion: 33.4.11
copyright: Copyright © 2026 Doujiao Team
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: '../../registry'
    to: 'registry'
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 豆角工具箱
  uninstallDisplayName: 豆角工具箱
  artifactName: "${productName}-Setup-${version}.${ext}"
